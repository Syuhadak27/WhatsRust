name: check

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CEF_VERSION: "131.3.5+gfe0854a+chromium-131.0.6778.140"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cef_platform: linux64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            cef_platform: windows64
          - runner: macos-14
            target: aarch64-apple-darwin
            cef_platform: macosarm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: src-tauri -> target
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libasound2-dev libnss3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Download CEF
        shell: bash
        run: |
          set -euo pipefail
          CEF_DIR="$RUNNER_TEMP/cef"
          mkdir -p "$CEF_DIR"
          curl -fL "https://cef-builds.spotifycdn.com/cef_binary_${CEF_VERSION}_${{ matrix.cef_platform }}_minimal.tar.bz2" -o "$RUNNER_TEMP/cef.tar.bz2"
          tar -xjf "$RUNNER_TEMP/cef.tar.bz2" -C "$CEF_DIR" --strip-components=1
          echo "CEF_PATH=$CEF_DIR" >> "$GITHUB_ENV"
      - name: cargo check
        shell: bash
        working-directory: src-tauri
        env:
          CEF_PATH: ${{ env.CEF_PATH }}
        run: cargo check --target ${{ matrix.target }}
