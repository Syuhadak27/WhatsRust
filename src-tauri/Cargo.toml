[package]
name = "whatrust"
version = "0.7.0"
edition = "2021"
rust-version = "1.90"
default-run = "whatrust"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[[bin]]
name = "whatrust"
path = "src/main.rs"

[[bin]]
name = "whatrust_helper"
path = "src/helper.rs"

[dependencies]
cef = { version = "151.8.1", features = ["sandbox"] }
cef-dll-sys = "151.8.1"
winit = "0.30"
tray-icon = "0.21"
muda = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
dirs = "6"
open = "5"
url = "2"
percent-encoding = "2"
notify-rust = "4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSProcessInfo", "NSNotification", "NSThread"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[build-dependencies]
